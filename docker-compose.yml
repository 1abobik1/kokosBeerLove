services:
  auth_microservice:
    build:
      context: ./server
      args:
        SERVICE: auth_microservice
        PORT: 8000
    container_name: auth_microservice_container
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      db_auth:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_HOST_AUTH: db_auth
      DATABASE_PORT_AUTH: 5432
      REDIS_URL: redis://redis:6379
    networks:
      - mynetwork

  news_microservice:
    build:
      context: ./server
      args:
        SERVICE: news_microservice
        PORT: 8001
    container_name: news_microservice_container
    restart: unless-stopped
    ports:
      - "8001:8001"
    depends_on:
      db_news:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_HOST_NEWS: db_news
      DATABASE_PORT_NEWS: 5432
      REDIS_URL: redis://redis:6379
    networks:
      - mynetwork

  shop_microservice:
    build:
      context: ./server
      args:
        SERVICE: shop_microservice
        PORT: 8003
    container_name: shop_microservice_container
    restart: unless-stopped
    ports:
      - "8003:8003"
    depends_on:
      db_shop:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_HOST_SHOP: db_shop
      DATABASE_PORT_SHOP: 5432
      REDIS_URL: redis://redis:6379
    networks:
      - mynetwork

  match_microservice:
    build:
      context: ./server
      args:
        SERVICE: match_microservice
        PORT: 8002
    container_name: match_microservice_container
    restart: unless-stopped
    ports:
      - "8002:8002"
    depends_on:
      db_match:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_HOST_MATCH: db_match
      DATABASE_PORT_MATCH: 5432
      REDIS_URL: redis://redis:6379
    networks:
      - mynetwork

  kokoc_team_microservice:
    build:
      context: ./server
      args:
        SERVICE: kokoc_team_microservice
        PORT: 8004
    container_name: kokoc_team_microservice_container
    restart: unless-stopped
    ports:
      - "8004:8004"
    depends_on:
      db_kokoc_team:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_HOST_KOKOC_TEAM: db_kokoc_team
      DATABASE_PORT_KOKOC_TEAM: 5432
      REDIS_URL: redis://redis:6379
    networks:
      - mynetwork

  db_auth:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: postgres_db_auth
    environment:
      POSTGRES_USER: ${DATABASE_USER_AUTH}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD_AUTH}
      POSTGRES_DB: ${DATABASE_NAME_AUTH}
    volumes:
      - postgres_data_auth:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - mynetwork

  db_news:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: postgres_db_news
    environment:
      POSTGRES_USER: ${DATABASE_USER_NEWS}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD_NEWS}
      POSTGRES_DB: ${DATABASE_NAME_NEWS}
    volumes:
      - postgres_data_news:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - mynetwork

  db_shop:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: postgres_db_shop
    environment:
      POSTGRES_USER: ${DATABASE_USER_SHOP}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD_SHOP}
      POSTGRES_DB: ${DATABASE_NAME_SHOP}
    volumes:
      - postgres_data_shop:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - mynetwork

  db_match:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: postgres_db_match
    environment:
      POSTGRES_USER: ${DATABASE_USER_MATCH}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD_MATCH}
      POSTGRES_DB: ${DATABASE_NAME_MATCH}
    volumes:
      - postgres_data_match:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - mynetwork

  db_kokoc_team:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: postgres_db_kokoc_team
    environment:
      POSTGRES_USER: ${DATABASE_USER_KOKOC_TEAM}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD_KOKOC_TEAM}
      POSTGRES_DB: ${DATABASE_NAME_KOKOC_TEAM}
    volumes:
      - postgres_data_kokoc_team:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - mynetwork

  # Databases and Redis are reachable only inside the compose network.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    container_name: redis_container
    networks:
      - mynetwork

  frontend:
    build:
      context: ./client
    container_name: frontend_container
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
      - "${WEB_HTTPS_PORT:-8443}:443"
    depends_on:
      - auth_microservice
      - news_microservice
      - match_microservice
      - shop_microservice
      - kokoc_team_microservice
    volumes:
      # Uploaded images live in a volume, so they survive rebuilding the container.
      - uploads:/uploads
      # Optional: localhost.pem and localhost-key.pem from mkcert enable HTTPS (see README).
      - ./client/certificates:/etc/nginx/ssl:ro
    networks:
      - mynetwork

volumes:
  postgres_data_auth:
  postgres_data_news:
  postgres_data_shop:
  postgres_data_match:
  postgres_data_kokoc_team:
  uploads:

networks:
  mynetwork: