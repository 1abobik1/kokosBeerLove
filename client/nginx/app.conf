# Routes shared by the HTTP and HTTPS servers.
root /usr/share/nginx/html;
index index.html;

location / {
    limit_req zone=req_limit_per_ip burst=20 nodelay;
    limit_conn conn_limit_per_ip 10;
    try_files $uri /index.html;
}

# Uploaded images. Anyone can read them; PUT/DELETE (WebDAV) is allowed only after the auth service
# approves the request: administrators manage all folders, a user may put only their own avatar.
location ~ ^/uploads/(news_images|shop_images|player_photos|team_logos|user_avatar)/[A-Za-z0-9_.-]+\.(jpe?g|png|webp|gif)$ {
    root /;
    client_max_body_size 10M;
    dav_methods PUT DELETE;
    create_full_put_path on;
    dav_access user:rw group:r all:r;
    auth_request /_check_upload;
}

# Anything else under /uploads/ is read-only.
location /uploads/ {
    root /;
    limit_except GET HEAD {
        deny all;
    }
}

location = /_check_upload {
    internal;
    # Reading needs no permission, so GET/HEAD do not reach the auth service.
    if ($request_method ~ ^(GET|HEAD)$) {
        return 204;
    }
    proxy_pass http://auth_microservice:8000/api/auth/internal/check-upload/;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Original-Method $request_method;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Host $host;
}

# The upload check is for nginx only.
location /api/auth/internal/ {
    return 404;
}

location /api/auth/ {
    proxy_pass http://auth_microservice:8000;
    include /etc/nginx/snippets/proxy.conf;
}

location /api/news/ {
    proxy_pass http://news_microservice:8001;
    include /etc/nginx/snippets/proxy.conf;
}

location /api/match/ {
    proxy_pass http://match_microservice:8002;
    include /etc/nginx/snippets/proxy.conf;
}

location /api/shop/ {
    proxy_pass http://shop_microservice:8003;
    include /etc/nginx/snippets/proxy.conf;
}

location /api/kokoc_team/ {
    proxy_pass http://kokoc_team_microservice:8004;
    include /etc/nginx/snippets/proxy.conf;
}
